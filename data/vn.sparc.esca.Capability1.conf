<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="vn.sparc.esca.Capability1"/>
    <allow send_destination="vn.sparc.esca.Capability1"/>
    <allow receive_sender="vn.sparc.esca.Capability1"/>
  </policy>

  <!-- Anyone may ask what the devices around can do; only system services
       running as root change what this device says about itself. -->
  <policy context="default">
    <deny own="vn.sparc.esca.Capability1"/>
    <allow send_destination="vn.sparc.esca.Capability1"/>
    <allow receive_sender="vn.sparc.esca.Capability1"/>
    <deny send_destination="vn.sparc.esca.Capability1" send_interface="vn.sparc.esca.Capability1"
          send_member="RegisterManifestInfo"/>
    <deny send_destination="vn.sparc.esca.Capability1" send_interface="vn.sparc.esca.Capability1"
          send_member="RemoveManifestInfo"/>
  </policy>
</busconfig>
