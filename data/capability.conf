# esca-capabilityd settings. Every line is optional; these are the defaults.

# The name other devices see; the host name when unset.
#name =

# CoAP (UDP) port the manifest is served on, and the mDNS service type.
#port = 5683
#service_type = _esca-cap._udp

# Static facts about this device, merged into the manifest's "device".
#device_file = /etc/esca/capability/device.json
#state_dir = /var/lib/esca/capability

# Seconds between performance samples (only significant changes are
# published), between re-fetching every peer, and of silence before a peer
# is dropped.
#performance_interval = 10
#sync_interval = 30
#expire_after = 95

# Local changes within this many milliseconds go out to peers as one push.
#push_delay_ms = 500

#log_level = INFO
